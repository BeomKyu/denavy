[project]
name = "denavy"
version = "0.1.0"
description = "결정론적 LLM 에이전트 통제 아키텍처 - 비대칭 방어 파이프라인"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.46",
    "instructor>=1.14.5",
    "intentshield>=1.1.2",
    "langgraph>=1.1.3",
    "litellm>=1.82.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "z3-solver>=4.16.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
denavy = "denavy.__main__:main"

