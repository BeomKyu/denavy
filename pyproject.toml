[project]
name = "denavy"
version = "0.1.0"
description = "결정론적 LLM 에이전트 통제 아키텍처 - 비대칭 방어 파이프라인"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "instructor>=1.14.5",
    "litellm>=1.82.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

