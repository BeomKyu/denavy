[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denavy"
version = "0.1.0"
description = "Denavy 2.0 hybrid orchestration engine and evolution logging framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "litellm>=1.37",
    "rich>=13.7",
    "toml>=0.10.2"
]

[project.scripts]
denavy = "denavy_core.cli:app"

[tool.typer]
auto_envvar_prefix = "DENAVY"
