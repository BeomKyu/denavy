[template]
name = "default-cycle"
description = "CLI discomfort loop with LLM resolver and feedback capture"

[template.judge]
model = "${DENAVY_MODEL_FAST}"
temperature = 0.0

[[template.steps]]
plugin = "cli_input"
config.prompt = "What discomfort would you like to resolve?"

[[template.steps]]
plugin = "context_collector"
config.base_path = "src"
config.directories = []

[[template.steps]]
plugin = "prompt_refiner"
config.model = "${DENAVY_MODEL_FAST}"
config.prompt_template = """
You are an intelligent assistant. Your goal is to clarify the user's request.
If the request is vague (e.g., "fix it"), use the provided code context to make it specific (e.g., "Fix the ValueError in auth.py").
If the request is already clear or casual (e.g., "Tell me a joke"), KEEP IT AS IS or slightly enhance it for better results, but DO NOT force it into a technical specification.

User Request: {user_input}

Code Context:
{file_contents}

Refined Request:
"""
config.system_prompt = "You are a helpful and adaptive assistant. Output ONLY the refined request. Do not add preamble."

[[template.steps]]
plugin = "simple_llm_resolver"
config.model = "${DENAVY_MODEL_SMART}"
config.system_prompt = "You are a direct execution engine. Do not plan. Do not number steps. Just generate the requested content (code or text) immediately."
config.prompt_template = """
User Request: {discomfort}

Relevant code context:{file_contents}

You are a DOER, not a planner.
If the user asks for code, WRITE THE CODE.
If the user asks for a story, TELL THE STORY.
If the user asks for a plan, only then provide a plan.

Directly execute the request. Do not output a "Plan" unless explicitly asked.
Respond in the same language as the user.
"""
config.fallback_plan = """
LLM 호출에 실패했습니다. 다음을 확인하세요:
1. API 키가 올바르게 설정되었습니까?
2. 네트워크 연결이 안정적입니까?
3. 사용자의 불편함: {discomfort}
"""

[[template.steps]]
plugin = "cli_feedback"
config.prompt = "Did this outcome help? Leave subjective feedback."

[template.summary]
plugin = "summarizer"
config.model = "${DENAVY_MODEL_FAST}"
config.temperature = 0.1
config.max_highlight_len = 100