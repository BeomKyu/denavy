[template]
name = "default-cycle"
description = "CLI discomfort loop with LLM resolver and feedback capture"

[template.judge]
model = "gemini/gemini-2.5-flash-lite"
temperature = 0.0

[[template.steps]]
plugin = "cli_input"
config.prompt = "What discomfort would you like to resolve?"

[[template.steps]]
plugin = "context_collector"
config.base_path = "src"
config.directories = []

[[template.steps]]
plugin = "prompt_refiner"
config.model = "gemini/gemini-2.5-flash-lite"
config.prompt_template = """
You are a technical lead. Refine the following vague user request into a specific, actionable technical instruction based on the provided code context.

User Request: {user_input}

Code Context:
{file_contents}

Refined Instruction:
"""
config.system_prompt = "You are an expert software architect. Output ONLY the refined technical instruction. Do not add preamble."


[[template.steps]]
plugin = "simple_llm_resolver"
config.model = "gemini/gemini-2.5-flash-lite"
config.prompt_template = """
User discomfort: {discomfort}

Relevant code context:{file_contents}

Provide a numbered action plan that accelerates relief.
Respond in the same language as the user's discomfort.
"""
config.fallback_plan = """
LLM 호출에 실패했습니다. 다음을 확인하세요:
1. API 키가 올바르게 설정되었습니까?
2. 네트워크 연결이 안정적입니까?
3. 사용자의 불편함: {discomfort}
"""

[[template.steps]]
plugin = "cli_feedback"
config.prompt = "Did this outcome help? Leave subjective feedback."

[template.summary]
plugin = "summarizer"
config.model = "gemini/gemini-2.5-flash-lite"
config.temperature = 0.1
config.max_highlight_len = 100