[template]
name = "default-cycle"
description = "CLI discomfort loop with LLM resolver and feedback capture"

[template.judge]
model = "gemini/gemini-2.5-flash-lite"
system_prompt = "You evaluate whether the proposed Denavy template fits the discomfort. Respond with JSON containing approved and reason."
temperature = 0.0

[[template.steps]]
plugin = "cli_input"
config.prompt = "What discomfort would you like to resolve?"

[[template.steps]]
plugin = "context_aware_resolver"
config.directory = "src/denavy_common"
config.exclude_dirs = ["__pycache__", ".git", "node_modules", ".venv", "venv"]
config.exclude_patterns = [".pyc", ".pyo", ".egg-info, .env"]

[[template.steps]]
plugin = "simple_llm_resolver"
config.model = "gemini/gemini-2.5-flash-lite"
config.prompt_template = "User discomfort: {discomfort}\n\nRelevant code context:\n{file_contents}\n\nProvide a numbered action plan that accelerates relief.\nRespond in the same language as the user's discomfort."

[[template.steps]]
plugin = "cli_feedback"
config.prompt = "Did this outcome help? Leave subjective feedback."

[template.summary]
plugin = "summarizer"
config = {}
