[template]
name = "default-cycle"
description = "CLI discomfort loop with LLM resolver and feedback capture"

[template.judge]
model = "gemini/gemini-2.5-flash-lite"
system_prompt = """
You are a strict JSON-only Veto Engine.
Your *only* output must be a single, valid JSON object.
Do not add any text before or after the JSON.
Do not use markdown wrappers like ```json.
Review the user's discomfort and the proposed template steps.
Respond with JSON containing:
- "approved": boolean (true if the plan is good, false if it's irrelevant or bad)
- "reason": A short string explaining your decision.
"""
temperature = 0.0

[[template.steps]]
plugin = "cli_input"
config.prompt = "What discomfort would you like to resolve?"

[[template.steps]]
plugin = "context_collector"
config.base_path = "src"
config.directories = []

[[template.steps]]
plugin = "simple_llm_resolver"
config.model = "gemini/gemini-2.5-flash-lite"
config.prompt_template = """
User discomfort: {discomfort}

Relevant code context:{file_contents}

Provide a numbered action plan that accelerates relief.
Respond in the same language as the user's discomfort.
"""
config.fallback_plan = """
LLM 호출에 실패했습니다. 다음을 확인하세요:
1. API 키가 올바르게 설정되었습니까?
2. 네트워크 연결이 안정적입니까?
3. 사용자의 불편함: {discomfort}
"""

[[template.steps]]
plugin = "cli_feedback"
config.prompt = "Did this outcome help? Leave subjective feedback."

[template.summary]
plugin = "summarizer"
config = {}
