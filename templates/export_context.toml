# templates/export_context.toml (최종 '진화' v4)

[template]
name = "export-context-flat-md"
description = "Gathers ONLY CORE project code into individual .md files."

[[template.steps]]
plugin = "context_collector"
config.base_path = "."

# '진화': v4 모드 활성화 (개별 .md 파일 생성)
config.export_mode = "flat_md"

# '진화': 개별 파일이 저장될 '산출물' 폴더 지정
config.output_dir = "outputs/notebooklm_flat_md"

# 수집할 '핵심' 코드 지정
config.directories = [
    "src/denavy_core",
    "src/denavy_common",
    "src/plugins",
    "templates"
]
config.files = [
    "README.md",
    "pyproject.toml"
]

# '진화': context_writer 플러그인 단계는 이제 불필요