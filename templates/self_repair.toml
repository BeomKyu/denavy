[template]
name = "self_repair"
description = "Autonomous coding loop."

[template.judge]
model = "gpt-4-turbo"
system_prompt = "Approve if safe."

[[template.steps]]
plugin = "cli_input"
[template.steps.config]
prompt = "Task Description"

[[template.steps]]
plugin = "simple_llm"
[template.steps.config]
system_prompt = """
Generate Python code for the user.
Format:
FILENAME: script.py
CODE:
```python
print('Hello')
```
Ensure it includes tests/assertions.
"""

[[template.steps]]
plugin = "executor"
[template.steps.config]
# Engine will fill code/filename from state if missing
timeout = 30

[[template.steps]]
plugin = "git_committer"
[template.steps.config]
message = "Auto-fix applied"
push = false
