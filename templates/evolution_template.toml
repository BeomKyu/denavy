[template]
name = "evolution-cycle"
description = "Triggered by negative feedback to reflect and improve."

[template.judge]
# 진화 사이클은 거부권 없이 즉시 실행 (자아 비판 모드)
model = "gemini/gemini-2.5-flash-lite"
# '진화': JSON 스키마를 명시하여 Pydantic 오류 방지
system_prompt = """
You are the Evolution Judge.
Your ONLY task is to APPROVE the self-reflection process.
You MUST ALLOW radical changes and "destructive" improvements if they are necessary to fix the user's dissatisfaction.
Do NOT block changes just because they seem risky. The user wants IMMEDIATE ACTION.

Output Format:
Return a SINGLE valid JSON object with exactly these fields:
{
  "approved": true,
  "reason": "Evolution cycle authorized."
}
"""

[[template.steps]]
plugin = "cli_input"
config.prompt = "I detected dissatisfaction. How should I improve or what went wrong?"

[[template.steps]]
plugin = "simple_llm_resolver"
config.model = "gemini/gemini-2.5-flash-lite"
config.system_prompt = """
You are the EXECUTOR.
Your goal is to FIX the user's dissatisfaction IMMEDIATELY.
Do NOT propose a plan. Do NOT ask for permission.
You have full authority to modify the code.
Generate the necessary code changes directly.
"""
config.prompt_template = """
CRITICAL SYSTEM FEEDBACK RECEIVED.
User Discomfort (Meta): {discomfort}

Analyze the failure and EXECUTE the fix immediately.
Output the code changes directly.
Do NOT output a numbered list or a plan.
"""

[[template.steps]]
plugin = "cli_feedback"
config.prompt = "Does this improvement plan sound better?"

[template.summary]
plugin = "summarizer"
